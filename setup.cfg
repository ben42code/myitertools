[pycodestyle]
ignore = E221
max-line-length = 200
aggressive = 3
[flake8]
max-line-length = 200
exclude =
    .venv*
    __pycache__
[isort]
line_length = 200
multi_line_output = 5
extend_skip_glob = .venv*
[coverage:run]
source_pkgs = ben42code.myitertools
omit = __init__.py
branch = true
[coverage:report]
skip_empty = true
show_missing = true
fail_under = 100
[coverage:lcov]
output = lcov.info
