name: run-lint-actions
on:
  push:
    branches: [main]
  pull_request:

# A PR branch is already covered by the pull_request event, so pushes are
# narrowed to main to avoid running everything twice. Superseded runs of the
# same branch are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  flake8-lint-job:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    - name: Tests
      run: |
        python -m flake8 .
        python -m isort --check-only --diff .
