name: run-tests-actions
on:
  push:
    branches: [main]
  pull_request:

# A PR branch is already covered by the pull_request event, so pushes are
# narrowed to main to avoid running everything twice. Superseded runs of the
# same branch are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unittests-job:
    runs-on: ubuntu-latest
    strategy:
      # Report every failing version, not just the first.
      fail-fast: false
      matrix:
        # 3.15 is tested ahead of GA, but not claimed as supported until it ships.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15', 'pypy3.10', 'pypy3.11']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    - name: Tests
      run: |
        python -m unittest discover -v -s "tests" -p "*_test.py" -t "."

  coverage-job:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    - name: Coverage
      run: |
        coverage run -m unittest discover -s "tests" -p "*_test.py" -t "."
        coverage report
